<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>United Mod Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header>
    <p class="app-name">United Mod Manager</p>
    <nav aria-label="Main">
      <ul>
        <li><button type="button" data-view="home">Home</button></li>
        <li><button type="button" data-view="library">Library</button></li>
        <li><button type="button" data-view="browse">Browse</button></li>
      </ul>
    </nav>
  </header>
  <main id="main"></main>
  <!-- App-wide messages that are not part of any one page, such as "The mod list was updated." -->
  <div id="announcer" class="visually-hidden" role="status" aria-live="polite"></div>
  <script src="renderer.js"></script>
</body>
</html>
