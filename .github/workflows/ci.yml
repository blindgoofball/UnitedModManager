name: CI

on:
  pull_request:
  push:
    branches: [main]

# Pull requests from forks run this with a read-only token and no secrets.
permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The tests never start the app, so there is no need to download the Electron binary.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  catalog:
    name: Check the mod catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: a pull request can change package.json, so do not run install scripts from it.
      - run: npm ci --ignore-scripts
      - name: Validate every mod and game file
        run: node scripts/build-catalog.js --check

  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
