name: CI

on:
  pull_request:
  push:
    branches: [main]

# Pull requests from forks run this with a read-only token and no secrets.
permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The tests never start the app, so there is no need to download the Electron binary.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  catalog:
    name: Check the mod catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: a pull request can change package.json, so do not run install scripts from it.
      - run: npm ci --ignore-scripts
      - name: Validate every mod and game file
        run: node scripts/build-catalog.js --check

  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  # Only runs after a change reaches main and every check above has passed, so only a catalog that
  # validated is ever published. The app downloads this one file to get new mods without an app update.
  publish-catalog:
    name: Publish the catalog
    needs: [catalog, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and update the "catalog" release; nothing else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the catalog bundle
        run: node scripts/build-catalog.js
      - name: Publish it as the rolling "catalog" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view catalog --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create catalog --repo "${{ github.repository }}" \
              --title "Mod catalog" --prerelease --latest=false --target "${{ github.sha }}" \
              --notes "The current mod list, rebuilt automatically whenever the catalog changes. The app downloads this file; it is not a release of the app."
          gh release upload catalog dist/catalog/catalog.json --repo "${{ github.repository }}" --clobber
